[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "museum-api-gateway"
version = "1.0.0"
description = "API Gateway for Museum Collection Lifecycle Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "pydantic-settings==2.9.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
